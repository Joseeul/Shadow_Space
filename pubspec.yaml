name: shadow_space
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.6.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2
  flutter_launcher_icons: ^0.13.1
  http: ^1.2.2
  html: ^0.15.5
  cloud_firestore: ^5.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/ui_icon/Icon.png"
  adaptive_icon_foreground: "lib/assets/ui_icon/Icon.png"
  adaptive_icon_background: "#000000"

flutter:


  uses-material-design: true
  assets:
  - lib/assets/
  - lib/assets/ui_icon/

  fonts:
    - family: j-bold
      fonts:
        - asset: lib/assets/font/Jost-Bold.ttf

    - family: j-medium
      fonts:
        - asset: lib/assets/font/Jost-Medium.ttf
    
    - family: j-reg
      fonts:
        - asset: lib/assets/font/Jost-Regular.ttf